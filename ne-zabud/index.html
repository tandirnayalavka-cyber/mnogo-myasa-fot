<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#FAFAF9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Не забудь — всё важное рядом</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#202423;background:#fafaf9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a0d7bb;outline-offset:2px}button{border:0}.shell{max-width:540px;margin:auto;min-height:100dvh;padding:0 22px 115px}.top{padding-top:max(26px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}.mark{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:780;letter-spacing:-.45px}.mark-icon{width:33px;height:33px;background:#215d4b;color:white;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:19px}.avatar{height:40px;width:40px;border-radius:50%;background:#e7ede8;color:#215d4b;display:grid;place-items:center;font-size:17px;font-weight:750}.greeting{margin-top:40px}.eyebrow{font-size:13px;color:#7d8882;font-weight:600;letter-spacing:.15px}h1{margin:7px 0 0;font-size:34px;letter-spacing:-1.45px;line-height:1.12;font-weight:770}.lead{margin:10px 0 0;font-size:15px;line-height:1.55;color:#7e8581}.summary{margin-top:26px;background:#215d4b;border-radius:24px;padding:23px 23px 20px;color:white;position:relative;overflow:hidden}.summary:after{content:"";position:absolute;right:-40px;top:-65px;border:35px solid #ffffff0b;width:170px;height:170px;border-radius:50%}.summary-inner{position:relative;z-index:1}.summary .little{font-size:13px;color:#c2dfd1;font-weight:600}.summary .count{font-size:43px;font-weight:750;letter-spacing:-2px;margin-top:7px;line-height:1}.summary .count span{font-size:16px;letter-spacing:0;font-weight:500;color:#c2dfd1}.bar{margin-top:22px;height:7px;border-radius:20px;background:#ffffff31;overflow:hidden}.fill{height:100%;background:#bfe2cb;border-radius:20px;transition:width .3s}.stats{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#c6e2d3}.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}.section-head h2{font-size:20px;letter-spacing:-.65px;margin:0}.mutedbtn{background:none;color:#32765e;font-weight:650;font-size:13px;padding:8px 0}.tasklist{display:grid;gap:10px}.task{display:flex;align-items:center;gap:13px;background:white;border:1px solid #ecefec;border-radius:17px;padding:16px 14px;box-shadow:0 3px 15px #1c322706}.task-icon{height:45px;width:45px;display:grid;place-items:center;background:#f1f4ee;border-radius:14px;flex:none;font-size:21px}.task-body{min-width:0;flex:1}.task-name{font-size:15px;font-weight:680;line-height:1.35;overflow-wrap:anywhere}.task-detail{font-size:12px;color:#8b928d;margin-top:5px}.task.done .task-name{text-decoration:line-through;color:#929b95}.tick{height:28px;width:28px;border:1.8px solid #b6c5bd;border-radius:50%;background:white;color:white;display:grid;place-items:center;font-size:16px;flex:none}.task.done .tick{background:#277354;border-color:#277354}.more{background:none;color:#9aa29b;font-size:22px;padding:4px 4px}.empty{text-align:center;padding:36px 22px;background:white;border:1px dashed #dbe1db;border-radius:19px}.empty .big{font-size:33px}.empty strong{display:block;margin-top:9px;font-size:16px}.empty p{margin:7px 0 0;color:#8c958d;font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.category{background:white;border:1px solid #ecefec;border-radius:19px;padding:17px;text-align:left;min-height:118px}.category .ico{font-size:24px;margin-bottom:18px}.category strong{display:block;font-size:14px}.category small{color:#929993;font-size:12px;display:block;margin-top:4px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f0f3ee;border-radius:15px;padding:14px 8px;color:#284c3a;font-size:12px;font-weight:700;min-height:76px}.quick span{display:block;font-size:23px;margin-bottom:5px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid #ecefec;padding:11px max(16px,calc((100vw - 540px)/2 + 20px)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}.tab{background:none;color:#949d97;font-size:11px;font-weight:600;display:grid;justify-items:center;gap:5px;min-width:64px}.tab .symbol{font-size:23px}.tab.active{color:#22634d}.newfab{height:52px;width:52px;border-radius:18px;background:#24644d;color:white;font-size:31px;line-height:1;box-shadow:0 5px 16px #24644d37;transform:translateY(-11px)}.filterline{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0 12px}.chip{border-radius:25px;background:#edf0ed;color:#647168;font-size:13px;padding:10px 15px;font-weight:650;white-space:nowrap}.chip.active{background:#265d4a;color:white}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:650;color:#5d6b61}input,select,textarea{width:100%;border:1px solid #e3e8e2;background:#fbfcfa;border-radius:13px;padding:14px 13px;font-size:16px;color:#25342b;outline:none}input:focus,select:focus,textarea:focus{border-color:#5a9c7d}.sheetback{position:fixed;inset:0;background:#1a29226b;z-index:30;display:flex;justify-content:center;align-items:flex-end}.sheet{width:100%;max-width:540px;background:white;border-radius:26px 26px 0 0;padding:24px 23px calc(26px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0;font-size:23px;letter-spacing:-.8px}.close{background:#f0f2ef;border-radius:50%;height:34px;width:34px;color:#65736a;font-size:23px}.primary{width:100%;padding:16px;background:#24644d;color:white;border-radius:14px;font-size:15px;font-weight:750;margin-top:10px}.secondary{width:100%;padding:15px;background:#f0f4ef;color:#22523d;border-radius:14px;font-weight:700;margin-top:10px}.danger{color:#bc5045;background:none;padding:14px;font-weight:650;margin-top:5px;width:100%}.hide{display:none!important}.note{font-size:12px;line-height:1.5;color:#89928c;margin-top:15px}.pill{display:inline-block;background:#eaf3ec;color:#24644d;border-radius:9px;padding:5px 9px;font-weight:650;font-size:11px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#263f31;color:white;padding:12px 18px;border-radius:14px;font-size:13px;z-index:60;white-space:nowrap;box-shadow:0 7px 28px #0002}.intro{padding-top:40px}.template{display:flex;gap:13px;align-items:center;background:white;border:1px solid #edf0ed;border-radius:16px;padding:16px;margin-bottom:9px;text-align:left;width:100%}.template b{display:block;font-size:14px}.template small{display:block;color:#89958b;font-size:12px;margin-top:4px}.template .emoji{font-size:26px}.template .plus{margin-left:auto;color:#2c7255;font-size:22px}.notice{background:#f0f5ed;border-radius:17px;padding:18px;font-size:13px;color:#51695a;line-height:1.65;margin-top:22px}.settingsrow{padding:20px 0;border-bottom:1px solid #ebefeb;display:flex;justify-content:space-between;gap:20px}.settingsrow b{font-size:14px}.settingsrow small{color:#8d978f;display:block;margin-top:6px;line-height:1.5}@media(min-width:700px){body{background:#f2f4f1}.shell{background:#fafaf9;box-shadow:0 0 50px #0000000a}.tabs{left:50%;right:auto;transform:translateX(-50%);width:540px;padding-left:15px;padding-right:15px}}
</style></head><body><main class="shell"><header class="top"><div class="mark"><span class="mark-icon">✓</span> не забудь<span style="font-size:10px;color:#8c968d;font-weight:600;margin-left:1px">BETA</span></div><button class="avatar" aria-label="О приложении" onclick="go('settings')">Н</button></header><div id="view"></div></main>
<nav class="tabs" aria-label="Главная навигация"><button class="tab active" data-tab="home" onclick="go('home')"><span class="symbol">⌂</span>Главная</button><button class="tab" data-tab="all" onclick="go('all')"><span class="symbol">▤</span>Все дела</button><button class="newfab" aria-label="Добавить напоминание" onclick="openEditor()">+</button><button class="tab" data-tab="templates" onclick="go('templates')"><span class="symbol">▦</span>Шаблоны</button><button class="tab" data-tab="settings" onclick="go('settings')"><span class="symbol">⚙</span>Ещё</button></nav>
<div id="modal" class="hide"></div><div id="toast" class="toast hide"></div>
<script>
(function(){
'use strict';
const key='nezabud_prof_v1', oldKey='nezabud_v1';
const cats={Дом:['🏠','Дом'],Авто:['🚗','Авто'],Семья:['❤️','Семья'],Финансы:['💳','Финансы'],Здоровье:['🌿','Здоровье'],Другое:['🗓️','Другое']};
const samples=[['Оплатить коммунальные услуги','Дом','month'],['Продлить ОСАГО','Авто','year'],['Поменять фильтр для воды','Дом','month'],['Поздравить с днём рождения','Семья','year'],['Оплатить интернет','Финансы','month'],['Записаться на плановый осмотр','Здоровье','year']];
let tasks=[];try{let v=JSON.parse(localStorage.getItem(key)||'[]');tasks=Array.isArray(v)?v:[]}catch(e){}
let page='home',filter='Все',editing=null;
const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function today(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateAdd(days){let d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function formatDate(s){if(!s)return 'Без даты';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch(e){alert('Не удалось сохранить данные в браузере')}}
function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2200)}
function countToday(){return tasks.filter(t=>!t.done&&t.date<=today()).length}
function sorted(list){return [...list].sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date))}
function row(t){let symbol=(cats[t.cat]||cats.Другое)[0],due=t.date<today()&&!t.done?'Просрочено · ':'';return '<div class="task '+(t.done?'done':'')+'"><button class="tick" aria-label="Отметить выполненным" onclick="toggle(\''+esc(t.id)+'\')">'+(t.done?'✓':'')+'</button><div class="task-icon">'+symbol+'</div><div class="task-body" onclick="edit(\''+esc(t.id)+'\')"><div class="task-name">'+esc(t.name)+'</div><div class="task-detail">'+due+formatDate(t.date)+(t.time?' · '+esc(t.time):'')+(t.repeat!=='none'?' · ↻':'')+'</div></div><button class="more" aria-label="Редактировать" onclick="edit(\''+esc(t.id)+'\')">⋯</button></div>'}
function list(arr,msg){return arr.length?'<div class="tasklist">'+sorted(arr).map(row).join('')+'</div>':'<div class="empty"><div class="big">✨</div><strong>'+msg+'</strong><p>Нажми на плюс внизу, чтобы добавить первое напоминание.</p></div>'}
function render(){
document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===page));
let h='';
if(page==='home'){
let active=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0,upcoming=active.filter(t=>t.date<=dateAdd(7)).length;
h='<section class="greeting"><div class="eyebrow">'+new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+'</div><h1>Всё важное<br>под контролем.</h1><p class="lead">Меньше держи в голове. Больше успевай.</p></section><div class="summary"><div class="summary-inner"><div class="little">Твои напоминания</div><div class="count">'+active.length+' <span>активных дел</span></div><div class="bar"><div class="fill" style="width:'+percent+'%"></div></div><div class="stats"><span>Выполнено: '+done+'</span><span>На ближайшие 7 дней: '+upcoming+'</span></div></div></div><div class="section-head"><h2>На сегодня</h2><button class="mutedbtn" onclick="go(\'all\')">Все дела →</button></div>'+list(active.filter(t=>t.date<=today()),'На сегодня всё спокойно')+'<div class="section-head"><h2>Быстро добавить</h2></div><div class="quick"><button onclick="quick(\'Оплатить счёт\',\'Финансы\')"><span>💳</span>Платёж</button><button onclick="quick(\'Важная дата\',\'Семья\')"><span>🎁</span>Дата</button><button onclick="openEditor()"><span>＋</span>Своё дело</button></div><div class="section-head"><h2>Ближайшие дела</h2></div>'+list(active.filter(t=>t.date>today()).slice(0,4),'Пока ничего не запланировано');
}
if(page==='all'){
let opts=['Все','Активные','Выполненные'];let arr=filter==='Активные'?tasks.filter(t=>!t.done):filter==='Выполненные'?tasks.filter(t=>t.done):tasks;
h='<div class="intro"><div class="eyebrow">Мои напоминания</div><h1>Все дела<span style="color:#9fb3a7">.</span></h1><p class="lead">Здесь всё, что важно не забыть.</p></div><div class="section-head"><h2>'+tasks.length+' напоминаний</h2><button class="mutedbtn" onclick="openEditor()">+ Добавить</button></div><div class="filterline">'+opts.map(o=>'<button class="chip '+(filter===o?'active':'')+'" onclick="setFilter(\''+o+'\')">'+o+'</button>').join('')+'</div>'+list(arr,'В этом разделе пока пусто');
}
if(page==='templates'){
h='<div class="intro"><div class="eyebrow">Не нужно всё придумывать</div><h1>Готовые<br>напоминания.</h1><p class="lead">Выбери ситуацию из жизни, а мы поможем не забыть важное.</p></div><div class="section-head"><h2>Популярные шаблоны</h2></div>'+samples.map((s,i)=>'<button class="template" onclick="useTemplate('+i+')"><span class="emoji">'+cats[s[1]][0]+'</span><span><b>'+esc(s[0])+'</b><small>'+esc(s[1])+' · '+(s[2]==='month'?'Каждый месяц':'Каждый год')+'</small></span><span class="plus">＋</span></button>').join('')+'<div class="notice">Каждый шаблон можно настроить под себя: выбрать дату, время и частоту повторения.</div>';
}
if(page==='settings'){
h='<div class="intro"><div class="eyebrow">Пробная версия 0.2</div><h1>Всё просто.</h1><p class="lead">Первый вариант приложения, который мы проверяем на удобство.</p></div><div class="section-head"><h2>О приложении</h2></div><div class="settingsrow"><div><b>Хранение напоминаний</b><small>На этом устройстве, в браузере. При очистке данных браузера они могут исчезнуть.</small></div><span>✓</span></div><div class="settingsrow"><div><b>Уведомления</b><small>Фоновые push ещё не подключены. Приложение пока не гарантирует напоминание при закрытом браузере.</small></div><span>◷</span></div><div class="settingsrow"><div><b>Искусственный интеллект</b><small>Будет подключён в следующих версиях после тестирования удобства.</small></div><span>◷</span></div><button class="secondary" onclick="exportData()">Сохранить резервную копию</button><div class="note">Это тестовая версия. Не используй её как единственный источник критически важных напоминаний.</div>';
}
$('view').innerHTML=h;
}
window.go=p=>{page=p;render();window.scrollTo({top:0,behavior:'smooth'})};
window.setFilter=x=>{filter=x;render()};
window.toggle=id=>{let t=tasks.find(t=>t.id===id);if(!t)return;if(t.done){t.done=false}else if(t.repeat!=='none'){let d=new Date(t.date+'T12:00:00'),now=new Date(today()+'T12:00:00');do{if(t.repeat==='day')d.setDate(d.getDate()+1);if(t.repeat==='week')d.setDate(d.getDate()+7);if(t.repeat==='month')d.setMonth(d.getMonth()+1);if(t.repeat==='year')d.setFullYear(d.getFullYear()+1)}while(d<=now);t.date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());showToast('Готово! Следующее напоминание назначено')}else t.done=true;save();render()};
window.edit=id=>{let t=tasks.find(t=>t.id===id);if(t)openEditor(t)};
window.quick=(name,cat)=>openEditor({name,cat,date:today(),time:'10:00',repeat:'none'});
window.useTemplate=i=>{let s=samples[i];openEditor({name:s[0],cat:s[1],date:today(),time:'10:00',repeat:s[2]})};
window.openEditor=function(t){editing=t&&t.id?t.id:null;let v=t||{name:'',cat:'Другое',date:today(),time:'10:00',repeat:'none'};
$('modal').className='sheetback';$('modal').innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Напоминание"><div class="sheethead"><h2>'+(editing?'Редактировать':'Новое напоминание')+'</h2><button class="close" aria-label="Закрыть" onclick="closeEditor()">×</button></div><form id="taskform"><div class="field"><label for="taskname">Что нужно не забыть?</label><input id="taskname" maxlength="110" required placeholder="Например, оплатить интернет" value="'+esc(v.name)+'"></div><div class="field"><label for="taskcat">Категория</label><select id="taskcat">'+Object.keys(cats).map(c=>'<option value="'+c+'" '+(v.cat===c?'selected':'')+'>'+cats[c][0]+' '+c+'</option>').join('')+'</select></div><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px"><div class="field"><label for="taskdate">Дата</label><input id="taskdate" type="date" required value="'+esc(v.date)+'"></div><div class="field"><label for="tasktime">Время</label><input id="tasktime" type="time" required value="'+esc(v.time||'10:00')+'"></div></div><div class="field"><label for="taskrepeat">Повторять</label><select id="taskrepeat"><option value="none">Не повторять</option><option value="day">Каждый день</option><option value="week">Каждую неделю</option><option value="month">Каждый месяц</option><option value="year">Каждый год</option></select></div><button class="primary" type="submit">'+(editing?'Сохранить изменения':'Создать напоминание')+'</button></form>'+(editing?'<button class="danger" onclick="removeTask()">Удалить напоминание</button>':'')+'<p class="note">Пока это тестовая версия без фоновых push-уведомлений.</p></div>';$('taskrepeat').value=v.repeat||'none';
$('taskform').onsubmit=function(e){e.preventDefault();let x={name:$('taskname').value.trim(),cat:$('taskcat').value,date:$('taskdate').value,time:$('tasktime').value,repeat:$('taskrepeat').value};if(!x.name||!x.date||!x.time)return;if(editing){Object.assign(tasks.find(t=>t.id===editing),x)}else tasks.push({id:String(Date.now())+'-'+Math.floor(Math.random()*99999),done:false,...x});save();closeEditor();render();showToast('Напоминание сохранено')};setTimeout(()=>$('taskname').focus(),80)};
window.closeEditor=()=>{$('modal').className='hide';$('modal').innerHTML='';editing=null};
window.removeTask=()=>{if(!editing||!confirm('Удалить это напоминание?'))return;tasks=tasks.filter(t=>t.id!==editing);save();closeEditor();render();showToast('Напоминание удалено')};
window.exportData=()=>{let b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ne-zabud-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeEditor()});
render();
})();
</script></body></html>
