<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Много Мяса — ФОТ</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.app{max-width:1400px;margin:auto;padding:18px}h1{font-size:22px}.bar,.cards{display:flex;gap:10px;flex-wrap:wrap}.bar{align-items:center}.cards{margin:16px 0}.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:12px 16px;min-width:150px}.v{font-size:21px;font-weight:800;margin-top:5px}.muted{color:#738096;font-size:12px}select,button,input{font:inherit;min-height:42px;border-radius:10px;border:1px solid #dfe5ee;background:white;padding:8px 11px}.edit{min-height:32px;width:120px;padding:4px 6px}.rate{width:72px;text-align:center}.del{min-height:30px;padding:3px 8px;border:0;background:#fff0f0;color:#b42318}.actions{width:42px}.modes{display:flex;gap:4px;background:#e8edf5;padding:4px;border-radius:12px}.modes button{border:0;font-weight:800}.modes .active.plan{background:#2563eb;color:#fff}.modes .active.fact{background:#169b62;color:#fff}.wrap{overflow:auto;background:white;border:1px solid #e2e7ef;border-radius:14px}table{border-collapse:collapse;min-width:1200px;width:100%;font-size:13px}th,td{border:1px solid #e5e9f0;padding:5px;text-align:center}th{background:#f8fafc}.fri{background:#fff2cc!important}.sat{background:#ffe0b2!important}.dow{font-size:10px;color:#738096;display:block;margin-top:2px}.name{text-align:left;min-width:155px}.shift{width:38px;height:38px;padding:0;font-weight:800}.p1{background:#e8f0ff;color:#1e5ad7}.p05{background:#f3f6ff;color:#1e5ad7}.f1{background:#e6f7ef;color:#128154}.f05{background:#f2fbf7;color:#128154}.sum{font-weight:800;min-width:90px}@media(max-width:700px){.app{padding:10px}.card{min-width:calc(50% - 5px);flex:1}h1{font-size:19px}}
</style></head><body><div id="lock" style="position:fixed;inset:0;background:#f5f7fb;z-index:9999;display:flex;align-items:center;justify-content:center"><div style="background:white;padding:28px;border:1px solid #e2e7ef;border-radius:18px;width:min(320px,85vw);text-align:center"><h2 style="margin-top:0">Много Мяса · ФОТ</h2><div class="muted" style="margin-bottom:12px">Введите пароль</div><input id="pin" type="password" inputmode="numeric" maxlength="4" style="width:120px;text-align:center;font-size:22px;letter-spacing:6px"><br><button id="enter" style="margin-top:12px;font-weight:800">Войти</button><div id="err" style="color:#b42318;margin-top:10px;font-size:13px"></div></div></div><div class="app"><h1>Много Мяса · План / Факт ФОТ</h1><div class="bar"><select id="unit"></select><input id="month" type="month" value="2026-10"><div class="modes"><button id="plan" class="active plan">ПЛАН</button><button id="fact" class="fact">ФАКТ</button></div></div><div class="cards"><div class="card"><div class="muted">План ФОТ</div><div class="v" id="pt">0 ₽</div></div><div class="card"><div class="muted">Факт ФОТ</div><div class="v" id="ft">0 ₽</div></div><div class="card"><div class="muted">Отклонение</div><div class="v" id="diff">0 ₽</div></div></div><div class="muted" style="margin-bottom:8px">Нажатие: пусто → полная смена → ½ смены → пусто. ПЛАН синий, ФАКТ зелёный. Данные этой версии сохраняются в браузере.</div><button id="addEmp" style="margin:0 0 10px;font-weight:800">＋ Добавить сотрудника</button><div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></div><script>
const restaurant=[['Администратор 1',3000],['Администратор 2',3000],['Шашлычник 1',4000],['Шашлычник 2',4000],['Шашлычник 3',4000],['Повар 1',3500],['Повар 2',3500],['Упаковщик 1',2800],['Упаковщик 2',2800],['Упаковщик 3',2800],['Официант 1',2500],['Официант 2',2500],['Официант 3',2500],['Сервировка',0],['Уборщица',2600],['Посудница',2600],['Управляющая',0],['Курьер 1',0],['Курьер 2',0],['Курьер 3',0],['Курьер 4',0],['Стажёр 1',0],['Стажёр 2',0]];
const staff={'Джангильдина':restaurant,'Победы':restaurant,'Уральская':restaurant,'Фабрика-кухня':[['Заготовщик 1',0],['Заготовщик 2',0],['Заготовщик 3',0],['Уборщица',0],['Повар соуса',0],['Повар суп',0],['Управляющий',120000]],'Люди в найме':Array.from({length:7},(_,i)=>['Сотрудник '+(i+1),0])};
let custom=JSON.parse(localStorage.getItem('mmfot_custom')||'{}');let deleted=JSON.parse(localStorage.getItem('mmfot_deleted')||'{}');const list=unit=>staff[unit].map((p,i)=>({p,i,key:'base-'+i})).filter(x=>!deleted[unit+'|'+x.key]).concat((custom[unit]||[]).map((p,i)=>({p,i,key:'custom-'+i})).filter(x=>!deleted[unit+'|'+x.key]));const u=document.querySelector('#unit');Object.keys(staff).forEach(x=>u.add(new Option(x,x)));let mode='plan';let db=JSON.parse(localStorage.getItem('mmfot')||'{}');let edits=JSON.parse(localStorage.getItem('mmfot_staff')||'{}');const save=()=>localStorage.setItem('mmfot',JSON.stringify(db));const saveEdits=()=>localStorage.setItem('mmfot_staff',JSON.stringify(edits));const emp=(unit,k,p)=>edits[unit+'|'+k]||{name:p[0],rate:p[1]};const mon=document.querySelector('#month');const key=()=>u.value+'|'+mon.value;const get=()=>db[key()]||(db[key()]={plan:{},fact:{}});const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
function render(){let [y,m]=mon.value.split('-').map(Number),days=new Date(y,m,0).getDate(),h='<tr><th class="name">Сотрудник</th><th>Ставка</th><th class="actions"></th>';const dns=['вс','пн','вт','ср','чт','пт','сб'];for(let d=1;d<=days;d++){let wd=new Date(y,m-1,d).getDay(),cl=wd===5?' class="fri"':wd===6?' class="sat"':'';h+='<th'+cl+'>'+d+'<span class="dow">'+dns[wd]+'</span></th>'};h+='<th>Итого</th></tr>';head.innerHTML=h;body.innerHTML='';let pTot=0,fTot=0;list(u.value).forEach((x,row)=>{let p=x.p,kid=x.key,i=row,e=emp(u.value,kid,p),rate=Number(e.rate)||0,tr=document.createElement('tr');let ntd=document.createElement('td');ntd.className='name';let ni=document.createElement('input');ni.className='edit';ni.value=e.name;ni.onchange=()=>{edits[u.value+'|'+kid]={name:ni.value,rate:rate};saveEdits();render()};ntd.appendChild(ni);tr.appendChild(ntd);let rtd=document.createElement('td'),ri=document.createElement('input');ri.className='edit rate';ri.type='number';ri.min='0';ri.step='100';ri.value=rate;ri.onchange=()=>{edits[u.value+'|'+kid]={name:ni.value,rate:Number(ri.value)||0};saveEdits();render()};rtd.appendChild(ri);tr.appendChild(rtd);let atd=document.createElement('td'),del=document.createElement('button');del.className='del';del.textContent='×';del.title='Удалить сотрудника';del.onclick=()=>{if(confirm('Удалить '+ni.value+'?')){deleted[u.value+'|'+kid]=true;localStorage.setItem('mmfot_deleted',JSON.stringify(deleted));render()}};atd.appendChild(del);tr.appendChild(atd);let ps=0,fs=0;for(let d=1;d<=days;d++){let td=document.createElement('td'),b=document.createElement('button'),k=i+'-'+d,v=get()[mode][k]||0;b.className='shift '+(mode==='plan'?(v===1?'p1':v===.5?'p05':''):(v===1?'f1':v===.5?'f05':''));b.textContent=v===1?'1':v===.5?'½':'—';b.onclick=()=>{let x=get()[mode][k]||0;get()[mode][k]=x===0?1:x===1?.5:0;save();render()};td.appendChild(b);tr.appendChild(td);ps+=(get().plan[k]||0)*rate;fs+=(get().fact[k]||0)*rate}pTot+=ps;fTot+=fs;let s=document.createElement('td');s.className='sum';s.textContent=rub(mode==='plan'?ps:fs);tr.appendChild(s);body.appendChild(tr)});pt.textContent=rub(pTot);ft.textContent=rub(fTot);diff.textContent=rub(fTot-pTot)}
addEmp.onclick=()=>{let name=prompt('Имя или должность сотрудника:');if(!name)return;let rate=Number(prompt('Ставка за полную смену, ₽:','0'));if(!Number.isFinite(rate)||rate<0)rate=0;(custom[u.value]||(custom[u.value]=[])).push([name,rate]);localStorage.setItem('mmfot_custom',JSON.stringify(custom));render()};function setMode(x){mode=x;plan.className=x==='plan'?'active plan':'plan';fact.className=x==='fact'?'active fact':'fact';render()}plan.onclick=()=>setMode('plan');fact.onclick=()=>setMode('fact');u.onchange=render;mon.onchange=render;render();
const unlock=()=>{if(pin.value==='8569'){sessionStorage.setItem('mmfot_auth','1');lock.style.display='none';err.textContent=''}else err.textContent='Неверный пароль'};enter.onclick=unlock;pin.onkeydown=e=>{if(e.key==='Enter')unlock()};if(sessionStorage.getItem('mmfot_auth')==='1')lock.style.display='none';</script></body></html>
