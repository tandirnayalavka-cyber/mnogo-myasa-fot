<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Много Мяса — ФОТ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
#lock{position:fixed;inset:0;background:#172033;z-index:9999;display:flex;align-items:center;justify-content:center}
.login{background:white;padding:32px;border-radius:20px;width:320px;text-align:center;box-shadow:0 20px 50px #0005}
.login h2{margin-top:0}.login input{width:100%;padding:14px;font-size:20px;border:1px solid #ccd3df;border-radius:10px;text-align:center}
.login button,.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#172033;color:white}
.login button{width:100%;margin-top:12px}
#error{color:#d33;margin-top:10px}
.app{max-width:1800px;margin:auto;padding:18px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0 20px 0 0;font-size:25px}
select,input{border:1px solid #ccd3df;border-radius:8px;padding:9px;background:white}
.revenue{width:160px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:white;border-radius:14px;padding:13px 18px;min-width:180px;box-shadow:0 2px 8px #0000000c}
.card small{display:block;color:#7a8495;margin-bottom:5px}.card b{font-size:20px}
.status{margin-left:auto;font-size:13px;color:#6b7280}
.tablewrap{overflow:auto;background:white;border-radius:14px;box-shadow:0 2px 10px #0000000c}
table{border-collapse:separate;border-spacing:0;min-width:1500px;width:100%}
th,td{border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5;text-align:center;padding:5px;white-space:nowrap}
th{position:sticky;top:0;background:#f9fafc;z-index:3;font-size:12px}
.namecol{position:sticky;left:0;background:white;z-index:2;min-width:165px;text-align:left}
.ratecol{position:sticky;left:165px;background:white;z-index:2;min-width:90px}
th.namecol,th.ratecol{z-index:5;background:#f9fafc}
.empname{width:155px;font-weight:700}
.rate{width:78px;text-align:right}
.day{min-width:54px;cursor:pointer;user-select:none}
.day:hover{outline:2px solid #9da9bd}
.plan1{background:#dbeafe!important;color:#1d4ed8;font-weight:bold}
.plan05{background:#eff6ff!important;color:#2563eb;font-weight:bold}
.fact1{background:#dcfce7!important;color:#15803d;font-weight:bold}
.fact05{background:#f0fdf4!important;color:#16a34a;font-weight:bold}
.friday{background:#fff7ed}
.saturday{background:#ffedd5}
.dayhead b{display:block;font-size:13px}.dayhead span{font-size:10px;color:#6b7280}
.type{font-size:10px;font-weight:bold;min-width:50px}
.planlabel{color:#2563eb}.factlabel{color:#15803d}
.total{font-weight:bold;min-width:85px}
.delete{border:0;background:none;color:#c33;font-size:17px;cursor:pointer}
.add{margin:14px 0;background:#16a34a}
.legend{font-size:12px;color:#6b7280;margin:10px 2px}
@media(max-width:700px){.app{padding:8px}.top h1{width:100%}.card{min-width:145px}.status{width:100%}}
</style>
</head>
<body>

<div id="lock">
 <div class="login">
  <h2>Много Мяса</h2>
  <p>Управление ФОТ</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="Пароль">
  <button onclick="unlock()">Войти</button>
  <div id="error"></div>
 </div>
</div>

<div class="app">
 <div class="top">
  <h1>ФОТ · Много Мяса</h1>
  <select id="unit"></select>
  <input id="month" type="month">
  <span>Выручка:</span>
  <input id="revenue" class="revenue" type="number" placeholder="₽">
  <div class="status" id="cloud">☁ Загрузка...</div>
 </div>

 <div class="cards">
  <div class="card"><small>План ФОТ</small><b id="planSum">0 ₽</b></div>
  <div class="card"><small>Факт ФОТ</small><b id="factSum">0 ₽</b></div>
  <div class="card"><small>Отклонение</small><b id="diffSum">0 ₽</b></div>
  <div class="card"><small>ФОТ факт / выручка</small><b id="fotPercent">—</b></div>
 </div>

 <div class="tablewrap"><table id="tbl"></table></div>
 <button class="btn add" onclick="addEmployee()">＋ Добавить сотрудника</button>
 <div class="legend">Синий — ПЛАН · зелёный — ФАКТ · нажатие по ячейке: 0 → 1 → ½ → 0. Пятница и суббота выделены.</div>
</div>

<script>
const SUPABASE_URL='https://coggpgbxkswlpuvqvtky.supabase.co';
const SUPABASE_KEY='sb_publishable_EdmxCZsHL632NzNe7orRzA_qkeILiFt';

const units=['Джангильдина','Победы','Уральская','Фабрика-кухня','Люди в найме'];

const restaurant=[
 ['Администратор 1',3000],['Администратор 2',3000],
 ['Шашлычник 1',4000],['Шашлычник 2',4000],['Шашлычник 3',4000],
 ['Повар 1',3500],['Повар 2',3500],
 ['Упаковщик 1',2800],['Упаковщик 2',2800],['Упаковщик 3',2800],
 ['Официант 1',2500],['Официант 2',2500],['Официант 3',2500],
 ['Сервировка',0],['Уборщица',2600],['Посудница',2600],
 ['Управляющая',0],
 ['Курьер 1',0],['Курьер 2',0],['Курьер 3',0],['Курьер 4',0],
 ['Стажёр 1',0],['Стажёр 2',0]
];

const factory=[
 ['Заготовщик 1',0],['Заготовщик 2',0],['Заготовщик 3',0],
 ['Уборщица 1',0],['Повар соуса 1',0],['Повар суп 1',0],['Управляющий 1',120000]
];

function defaults(){
 let employees={};
 units.forEach(u=>{
   let src=u==='Фабрика-кухня'?factory:(u==='Люди в найме'?Array.from({length:7},(_,i)=>['Сотрудник '+(i+1),0]):restaurant);
   employees[u]=src.map((x,i)=>({id:Date.now()+Math.random()+i,name:x[0],rate:x[1]}));
 });
 return {employees,schedules:{},revenue:{}};
}

let state=defaults();
let saveTimer;

const $=id=>document.getElementById(id);
const money=n=>Math.round(n||0).toLocaleString('ru-RU')+' ₽';

function unlock(){
 if($('pin').value==='8569'){
   sessionStorage.setItem('mm_auth','1');
   $('lock').style.display='none';
 }else $('error').textContent='Неверный пароль';
}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
if(sessionStorage.getItem('mm_auth')==='1') $('lock').style.display='none';

units.forEach(u=>$('unit').add(new Option(u,u)));
const now=new Date();
$('month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');

function key(){return $('unit').value+'|'+$('month').value}
function schedule(){
 if(!state.schedules[key()]) state.schedules[key()]={};
 return state.schedules[key()];
}

async function loadCloud(){
 try{
   const r=await fetch(SUPABASE_URL+'/rest/v1/fot_data?select=data&id=eq.1',{
     headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
   });
   if(!r.ok) throw new Error(await r.text());
   const rows=await r.json();
   if(rows[0] && rows[0].data && Object.keys(rows[0].data).length){
     state=rows[0].data;
     units.forEach(u=>{if(!state.employees[u])state.employees[u]=defaults().employees[u]});
     if(!state.schedules)state.schedules={};
     if(!state.revenue)state.revenue={};
   }
   $('cloud').textContent='☁ Облако подключено';
   render();
 }catch(e){
   console.error(e);
   $('cloud').textContent='⚠ Ошибка облака';
   render();
 }
}

function save(){
 $('cloud').textContent='☁ Сохранение...';
 clearTimeout(saveTimer);
 saveTimer=setTimeout(saveCloud,500);
}

async function saveCloud(){
 try{
   const r=await fetch(SUPABASE_URL+'/rest/v1/fot_data?id=eq.1',{
     method:'PATCH',
     headers:{
       apikey:SUPABASE_KEY,
       Authorization:'Bearer '+SUPABASE_KEY,
       'Content-Type':'application/json',
       Prefer:'return=minimal'
     },
     body:JSON.stringify({data:state,updated_at:new Date().toISOString()})
   });
   if(!r.ok) throw new Error(await r.text());
   $('cloud').textContent='✓ Сохранено в облаке';
 }catch(e){
   console.error(e);
   $('cloud').textContent='⚠ Не удалось сохранить';
 }
}

function days(){
 const [y,m]=$('month').value.split('-').map(Number);
 return new Date(y,m,0).getDate();
}
function weekday(d){
 const [y,m]=$('month').value.split('-').map(Number);
 return new Date(y,m-1,d).getDay();
}
const wd=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

function getShift(id,d,type){
 const s=schedule();
 return s[id]?.[d]?.[type]||0;
}
function setShift(id,d,type){
 const s=schedule();
 if(!s[id])s[id]={};
 if(!s[id][d])s[id][d]={plan:0,fact:0};
 let v=s[id][d][type]||0;
 s[id][d][type]=v===0?1:v===1?.5:0;
 save();render();
}

function updateName(id,v){
 const e=state.employees[$('unit').value].find(x=>String(x.id)===String(id));
 if(e){e.name=v;save()}
}
function updateRate(id,v){
 const e=state.employees[$('unit').value].find(x=>String(x.id)===String(id));
 if(e){e.rate=Number(v)||0;save();render()}
}
function removeEmployee(id){
 if(!confirm('Удалить сотрудника?'))return;
 state.employees[$('unit').value]=state.employees[$('unit').value].filter(x=>String(x.id)!==String(id));
 save();render();
}
function addEmployee(){
 const name=prompt('Имя или должность сотрудника:');
 if(!name)return;
 const rate=Number(prompt('Ставка за полную смену, ₽:','0'))||0;
 state.employees[$('unit').value].push({id:Date.now()+Math.random(),name,rate});
 save();render();
}

function render(){
 const u=$('unit').value;
 const ds=days();
 const emps=state.employees[u]||[];
 const revKey=key();
 $('revenue').value=state.revenue[revKey]||'';

 let h='<thead><tr><th class="namecol">Сотрудник</th><th class="ratecol">Ставка</th><th></th>';
 for(let d=1;d<=ds;d++){
   const w=weekday(d),cls=w===5?'friday':w===6?'saturday':'';
   h+=`<th class="${cls} dayhead"><b>${d}</b><span>${wd[w]}</span></th>`;
 }
 h+='<th>Итого</th></tr></thead><tbody>';

 let planTotal=0,factTotal=0;

 emps.forEach(e=>{
   let ep=0,ef=0;
   for(let d=1;d<=ds;d++){ep+=getShift(e.id,d,'plan');ef+=getShift(e.id,d,'fact')}
   planTotal+=ep*e.rate; factTotal+=ef*e.rate;

   h+=`<tr>
   <td class="namecol" rowspan="2"><input class="empname" value="${esc(e.name)}" onchange="updateName('${e.id}',this.value)"></td>
   <td class="ratecol" rowspan="2"><input class="rate" type="number" value="${e.rate}" onchange="updateRate('${e.id}',this.value)"></td>
   <td class="type planlabel">ПЛАН</td>`;

   for(let d=1;d<=ds;d++){
     const v=getShift(e.id,d,'plan'),w=weekday(d);
     const cls=v===1?'plan1':v===.5?'plan05':(w===5?'friday':w===6?'saturday':'');
     h+=`<td class="day ${cls}" onclick="setShift('${e.id}',${d},'plan')">${v===1?'1':v===.5?'½':''}</td>`;
   }
   h+=`<td class="total">${money(ep*e.rate)}</td></tr>`;

   h+=`<tr><td class="type factlabel">ФАКТ</td>`;
   for(let d=1;d<=ds;d++){
     const v=getShift(e.id,d,'fact'),w=weekday(d);
     const cls=v===1?'fact1':v===.5?'fact05':(w===5?'friday':w===6?'saturday':'');
     h+=`<td class="day ${cls}" onclick="setShift('${e.id}',${d},'fact')">${v===1?'1':v===.5?'½':''}</td>`;
   }
   h+=`<td class="total">${money(ef*e.rate)} <button class="delete" onclick="removeEmployee('${e.id}')">×</button></td></tr>`;
 });

 h+='</tbody>';
 $('tbl').innerHTML=h;
 $('planSum').textContent=money(planTotal);
 $('factSum').textContent=money(factTotal);
 $('diffSum').textContent=money(factTotal-planTotal);
 const rev=Number(state.revenue[revKey])||0;
 $('fotPercent').textContent=rev?((factTotal/rev)*100).toFixed(1)+'%':'—';
}

function esc(s){
 return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

$('unit').onchange=render;
$('month').onchange=render;
$('revenue').onchange=function(){
 state.revenue[key()]=Number(this.value)||0;
 save();render();
};

render();
loadCloud();
</script>
</body>
</html>
