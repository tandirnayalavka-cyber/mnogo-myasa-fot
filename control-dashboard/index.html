const periods={today:'Сегодня',week:'7 дней',month:'30 дней',year:'Год'};
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';const compact=n=>n>=1e6?(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн ₽':money(n);
const sum=a=>a.reduce((x,y)=>x+y,0);
function chartSeries(){let data=branches.filter(b=>state.branch==='all'||b.id===state.branch);let days=Array.from({length:7},(_,i)=>sum(data.map(b=>b.data[i])));if(state.period==='today'){days=days.map(v=>Math.round(v*0.95))}else if(state.period==='month'){days=days.map(v=>Math.round(v*4.25))}else if(state.period==='year'){days=days.map(v=>Math.round(v*50.8))}return days}
function calcMetrics(){const days=chartSeries();const revenue=state.period==='today'?days[6]*1000:sum(days)*1000;const selected=branches.filter(b=>state.branch==='all'||b.id===state.branch);const avg=Math.round(sum(selected.map(b=>b.avg*sum(b.data)))/sum(selected.map(b=>sum(b.data))));return{days,revenue,avg,orders:Math.round(revenue/avg),change:7.8,prev:revenue/1.078}}
function notice(){return `<div class="demo-notice">${icon('help',15)} <span><strong>ДЕМОНСТРАЦИОННАЯ ВЕРСИЯ</strong> — все суммы, остатки и показатели вымышлены. Frontpad ещё не подключён. Ни один показатель не отражает реальные результаты сети.</span></div>`}
function filterBar(){return `<div class="filters"><div class="filter-left">${[['all','Вся сеть'],['ural','Уральская'],['dzh','Джангильдина'],['pob','Победы']].map(([id,label])=>`<button data-branch="${id}" class="pill ${state.branch===id?'sel':''}">${label}</button>`).join('')}</div><div class="filter-right"><div class="select-wrap"><select id="periodSelect" aria-label="Период">${Object.entries(periods).map(([val,lab])=>`<option value="${val}" ${state.period===val?'selected':''}>${lab}</option>`).join('')}</select></div><div class="divider-v"></div><span style="font-size:11px;color:#8794a4">Сравнение с прошлым периодом</span></div></div>`}
function pageHeader(title,subtitle){return `<div class="page-heading"><div><div class="eyebrow">МНОГО МЯСА · АНАЛИТИКА</div><h1>${title}</h1><p>${subtitle}</p></div><div class="header-tools"><button class="primary-btn" id="exportBtn">${icon('download',15)} Экспорт таблицы</button></div></div>`}
function kpi(label,val,ico,color,bg,delta,desc,negative=false){return `<div class="kpi"><div class="kpi-head"><div class="kpi-label">${label}</div><div class="kpi-icon" style="color:${color};background:${bg}">${icon(ico,18)}</div></div><div class="kpi-value">${val}</div><div class="kpi-bottom"><span class="delta ${negative?'negative':''}">${delta}</span><span>${desc}</span></div></div>`}
function lineChart(){let current=chartSeries(),previous=current.map((n,i)=>Math.round(n*(i%3===0?.88:i%2===0?.97:.93)));let max=Math.ceil(Math.max(...current,...previous)*1.3/50)*50;const W=780,H=266,L=58,R=23,T=18,B=35;const X=i=>L+i*(W-L-R)/6,Y=n=>T+(H-T-B)*(1-n/max);const pointPath=a=>a.map((v,i)=>`${i===0?'M':'L'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<=4;i++){let v=max*i/4;const y=Y(v);grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#edf0f5" stroke-width="1"/><text x="${L-12}" y="${y+4}" text-anchor="end" fill="#9ba6b3" font-size="11">${Math.round(v).toLocaleString('ru-RU')}</text>`}const labels=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="График выручки: текущий и предыдущий периоды" preserveAspectRatio="none"><defs><linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef7f43" stop-opacity=".23"/><stop offset="1" stop-color="#ed7131" stop-opacity="0"/></linearGradient></defs>${grid}${labels.map((d,i)=>`<text x="${X(i)}" y="${H-8}" fill="#9aa6b3" font-size="11" text-anchor="middle">${d}</text>`).join('')}<path d="${pointPath(current)} L${X(6)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="url(#warm)"/><path d="${pointPath(previous)}" stroke="#7485d7" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="${pointPath(current)}" stroke="#ed7131" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${current.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d)}" r="4.5" fill="white" stroke="#ed7131" stroke-width="2.6"><title>${labels[i]}: ${money(d*1000)}</title></circle>`).join('')}</svg></div>`}
function revenueCard(){return `<section class="card"><div class="card-header"><div><h2 class="card-title">Динамика выручки</h2><p class="card-caption">Текущий период и аналогичный предыдущий · тыс. ₽</p></div><div class="card-action">${periods[state.period]}</div></div>${lineChart()}<div class="chart-legend"><span><i class="legend-color" style="background:#ed7131"></i>Текущий период</span><span><i class="legend-color" style="background:#7485d7"></i>Предыдущий период</span></div></section>`}
function channelsCard(){return `<section class="card"><div class="card-header"><div><h2 class="card-title">Каналы продаж</h2><p class="card-caption">Доля в общей выручке</p></div><button class="card-action" data-open="sales">Подробнее ↗</button></div><div class="donut-area"><div class="donut"><div class="donut-hole"><div><strong>100%</strong><br/><span>Все заказы</span></div></div></div><div class="donut-legend">${[['Сайт и приложение','44%','#ed7131'],['Агрегаторы','26%','#6078df'],['Зал','18%','#31b8b2'],['Самовывоз','12%','#a98add']].map(a=>`<div class="donut-item"><span><i class="legend-color" style="background:${a[2]}"></i>${a[0]}</span><strong>${a[1]}</strong></div>`).join('')}</div></div></section>`}
function branchMetrics(b){let factor=state.period==='today'?.95/7:state.period==='month'?4.25:state.period==='year'?50.8:1;return Math.round(sum(b.data)*1000*factor)}
function branchesCard(){const chosen=branches.filter(b=>state.branch==='all'||state.branch===b.id);let top=Math.max(...chosen.map(branchMetrics));return `<section class="card"><div class="card-header"><div><h2 class="card-title">Показатели филиалов</h2><p class="card-caption">Выручка и изменение к прошлому периоду</p></div><button class="card-action" data-open="branches">Все филиалы ↗</button></div><div class="branch-list">${chosen.map((b,i)=>{let v=branchMetrics(b),pct=Math.round(v/top*100);return `<div class="branch-item"><div class="branch-top"><div><div class="branch-name">${b.name}</div><div class="branch-sub">Средний чек ${money(b.avg)}</div></div><div class="branch-amount">${money(v)}<span style="color:${i===2?'#df6172':'#16a477'}">${i===2?'−2,1%':i===1?'+6,2%':'+12,4%'}</span></div></div><div class="progress"><div style="width:${pct}%;background:${b.color}"></div></div></div>`}).join('')}</div></section>`}
function factoryCard(){return `<section class="card"><div class="card-header"><div><h2 class="card-title">Фабрика-кухня · 27-я линия</h2><p class="card-caption">Производство и распределение полуфабрикатов</p></div><button class="card-action" data-open="factory">Производство ↗</button></div><div class="factory-preview"><div class="factory-numbers"><div class="factory-stat"><span>Выпущено</span><strong>316 кг</strong><small>за период</small></div><div class="factory-stat"><span>Отгружено</span><strong>268 кг</strong><small>по 3 филиалам</small></div><div class="factory-stat"><span>На остатке</span><strong>48 кг</strong><small>готовой продукции</small></div></div><div class="factory-flow"><div class="factory-flow-head"><span>Распределение отгрузок</span><span style="color:#9da8b4">268 кг</span></div><div class="flow-line"><div style="width:42%;background:#ed7131"></div><div style="width:33%;background:#6479df"></div><div style="width:25%;background:#2aaeb4"></div></div><div class="factory-meta"><span>Уральская 112,6 кг</span><span>Джангильдина 88,4 кг</span><span>Победы 67 кг</span></div></div></div></section>`}

case'finance':body=`<div class="kpi-grid">${kpi('Выручка',compact(m.revenue),'chart','#eb7738','#fff0e6','+7,8%','к прошлому периоду')}${kpi('Себестоимость',compact(m.revenue*.37),'box','#6479df','#eef0ff','37%','от выручки')}${kpi('Опер. расходы',compact(m.revenue*.39),'wallet','#d66578','#fff0f2','39%','от выручки')}${kpi('Опер. прибыль',compact(m.revenue*.24),'up','#16a477','#eaf8f2','24%','расчётная маржа')}</div>${tableCard('Структура расходов','Модель финансового отчёта, показатели условные',['Статья','Доля','Сумма'],[['Продукты и упаковка','37%',money(m.revenue*.37)],['Персонал','19%',money(m.revenue*.19)],['Аренда и коммунальные','9%',money(m.revenue*.09)],['Комиссии, маркетинг, прочее','11%',money(m.revenue*.11)]])}`;break;
case'alerts':body=`<div class="grid-bottom">${eventsCard()}${stockCard()}</div>`;break;
case'integrations':body=`<div class="secondary-hero">${icon('alert',18)} Сейчас система не связана с Frontpad и не считывает реальные продажи. Эти источники станут доступными после настройки.</div>${tableCard('Источники данных','План подключений без вымышленных API-возможностей',['Источник','Данные','Статус'],[['Frontpad API','Каталог и подтверждённые методы','<span class="pill-status wait">Не подключено</span>'],['Отчёты Frontpad (импорт)','Продажи, накладные, остатки','<span class="pill-status wait">Планируется</span>'],['Ревизии','Фактический учёт и история','<span class="pill-status wait">Планируется</span>'],['База приложения','Собственные записи и документы','<span class="pill-status wait">Нет сервера</span>']])}`;break;}
return notice()+pageHeader(title,sub)+filterBar()+body+footer()}
function nav(){document.getElementById('nav').innerHTML=NAV.map(g=>`<section class="nav-section"><div class="group-name">${g.title}</div>${g.items.map(([id,label,ico])=>`<button class="nav-btn ${id===state.view?'active':''}" data-open="${id}"><span class="nav-icon">${icon(ico,18)}</span><span>${label}</span>${id==='alerts'?'<span class="nav-badge">3</span>':''}</button>`).join('')}</section>`).join('');}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
function render(){nav();document.getElementById('crumb').textContent=state.view==='dashboard'?'Обзор сети':NAV.flatMap(g=>g.items).find(x=>x[0]===state.view)?.[1]||'Обзор сети';document.getElementById('app').innerHTML=state.view==='dashboard'?dashboard():secondaryPages();document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{state.view=el.dataset.open;render();closeMenu();window.scrollTo({top:0,behavior:'smooth'})}));document.querySelectorAll('[data-branch]').forEach(el=>el.addEventListener('click',()=>{state.branch=el.dataset.branch;render()}));document.getElementById('periodSelect')?.addEventListener('change',e=>{state.period=e.target.value;render()});document.getElementById('exportBtn')?.addEventListener('click',exportCsv)}
function exportCsv(){let m=calcMetrics(),rows=[['Раздел','Показатель','Значение'],['Фильтр','Раздел',state.view],['Фильтр','Филиал',state.branch],['Фильтр','Период',state.period],['Обзор','Выручка',m.revenue],['Обзор','Заказы',m.orders],['Обзор','Средний чек',m.avg],['Обзор','Общий долг',1284500],...branches.map(b=>['Филиалы',b.name,branchMetrics(b)]),...debts.map(d=>['Поставщики',d.name,d.sum])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='mnogo-myasa-demo-'+state.view+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.getElementById('topExport').addEventListener('click',exportCsv);document.getElementById('alertsBtn').addEventListener('click',()=>{state.view='alerts';render()});document.getElementById('openMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('open')});document.getElementById('overlay').addEventListener('click',closeMenu);
render();
</script>
